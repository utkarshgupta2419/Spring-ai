spring:
  application:
    name: ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          temperature: 0.7
          top-k: 40
          top-p: 0.9
          model: openchat:latest

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          temperature: 1
          model: tngtech/deepseek-r1t2-chimera:free
          top-p: 0.9


